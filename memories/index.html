<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>思い出 | お刺身くん</title>

    <link rel="stylesheet" href="aqua.design.css">
    <link rel="stylesheet" href="aqua.style.css">
    <link rel="stylesheet" href="aqua.color.css">

    <style>
        /* index.htmlと統一したテーマ定義 */
        .aqua-theme-pink {
            --aqua-primary: #ec4899;
            --aqua-primary-light: #f472b6;
            --aqua-primary-dark: #be185d;
            --aqua-gradient-primary: linear-gradient(135deg, #fbcfe8 0%, #f9a8d4 100%);
            --aqua-glass-bg: rgba(255, 241, 242, 0.25);
            --aqua-glass-border: rgba(255, 255, 255, 0.4);
        }

        /* 写真グリッドの調整 (Aquaのクラスで賄えない部分) */
        .photos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 12px;
            width: 100%;
        }

        .photo-block {
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border-radius: 12px;
            cursor: pointer;
            border: 1px solid var(--aqua-glass-border);
            transition: transform 0.3s ease;
        }

        .photo-block:hover {
            transform: scale(1.05);
        }

        .photo-block img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* モーダルのスタイル (Aqua Glass風) */
        #imageModal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
        }

        #modalImage {
            max-width: 90%;
            max-height: 90%;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            cursor: pointer;
        }
    </style>

    <link rel="icon" type="image/png" href="./img/avaters/0.8.1/aikon_t.png">
    <link rel="apple-touch-icon" sizes="96x96" href="./img/avaters/0.8.1/aikon_t.png">
</head>
<body class="aqua-reset aqua-theme-pink aqua-flex aqua-flex-col aqua-items-center aqua-p-4">

    <nav class="aqua-glass aqua-p-4 aqua-rounded-2xl aqua-flex aqua-gap-6 aqua-mb-10 aqua-mt-4">
        <a href="https://vrc.ossmxun.net/" class="aqua-text-white aqua-no-underline aqua-font-semibold aqua-opacity-100">Home</a>
        <a href="https://vrc.ossmxun.net/contact" class="aqua-text-white aqua-no-underline aqua-font-semibold aqua-opacity-80 aqua-hover:opacity-100">Contact</a>
        <a href="https://vrc.ossmxun.net/memories" class="aqua-text-white aqua-no-underline aqua-font-semibold aqua-opacity-80 aqua-hover:opacity-100">Memories</a>
    </nav>

    <main class="aqua-glass aqua-p-8 aqua-rounded-3xl aqua-container-md aqua-text-center">
        <a href="https://vrc.ossmxun.net/about" class="aqua-text-white aqua-no-underline aqua-font-semibold aqua-opacity-80 aqua-hover:opacity-100">About</a>
        <h1 class="aqua-text-white aqua-text-3xl aqua-mb-2 aqua-font-bold">Memories</h1>
        <p class="aqua-text-white aqua-opacity-80 aqua-mb-8">VRChatでの思い出の写真たち</p>

        <div class="photos">
            </div>
    </main>

    <div id="imageModal">
        <span class="close-btn">&times;</span>
        <div class="loading-spinner aqua-text-white" style="display:none;">Loading...</div>
        <img id="modalImage">
    </div>

    <footer class="aqua-mt-12 aqua-text-white aqua-opacity-60 aqua-text-sm">
        &copy; 2025 oSsmXun.
    </footer>

    <script src="photos.js"></script>
</body>
</html>
