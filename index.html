        .aqua-no-underline { text-decoration: none !important; }
        .aqua-hover\:opacity-100:hover { opacity: 1 !important; }
        .aqua-hover\:scale-105:hover { transform: scale(1.05) !important; }
        .aqua-object-contain { object-fit: contain !important; }
