<!DOCTYPE html>
<html lang="ja" data-theme="dark" data-style="glass" data-accent="pink">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About | お刺身くん</title>

<link rel="stylesheet" href="minaui.css">
<link rel="icon" type="image/png" href="img/avaters/0.8.1/aikon_t.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
/* ===== Theme ===== */
:root {
    --mina-primary: #ec4899;
    --mina-primary-hover: #f472b6;
    --mina-primary-active: #be185d;
    --mina-gradient-primary: linear-gradient(135deg, #f472b6 0%, #ec4899 100%);
    --mina-glass-bg: rgba(160, 60, 100, 0.22);
    --mina-glass-bg-light: rgba(160, 60, 100, 0.30);
    --mina-glass-border: rgba(255, 255, 255, 0.25);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    background: #0d0814;
    color: #fff;
    overflow-x: hidden;
}

/*
  CONCEPT B (V3.3 overlay edition): Memories の Diamond は通常のDOM描画の
  まま、その上に sticky の日付フィルターバー (Liquid Glass) が浮く。
  プロフィールカードは fixed で浮く (canvas より上)。

  Liquid Glass は sceneMode: 'overlay' で動作:
    - WebGL canvas はガラス領域だけを描く (境界 +1px 以外は alpha = 0)
    - Diamond は canvas より下、filterBar の中身は canvas より上
    - Scene Provider は「実DOMで実際に見えているもの」だけを再現する:
      body #0d0814 + .bg-overlay グラデーション (BG写真は描かない)

  Layer契約 (root stacking context, 上から):
     20  .filter-bar        (sticky, above the liquid canvas)
     10  .profile-card      (fixed, above the canvas)
      0  #mina-glcanvas     (fixed liquid overlay canvas)
     -1  .diamond-area      (below the canvas: refracted through it)
     -2  .bg-overlay       (fixed dim, behind the diamonds)
   CSSは要素ごとにposition/transformでstacking contextを作らないこと。
*/

/* Native/static fallback tint: keep this site's pink glass tone */
.mina-glass--liquid.mina-liquid-native,
.mina-glass-liquid.mina-liquid-native {
    background: var(--mina-glass-bg);
}

/* ===== Photo slideshow background ===== */
/* V3.3 修正: Scene Provider は「実DOMで見えているもの」(#0d0814 + bg-overlay
   gradient) のみ再現するため、背景写真レイヤーは完全廃止 (display:none)。 */
.bg-slideshow {
    display: none;
}

/* 背景グラデーションマスク: Diamondより後ろ */
.bg-overlay {
    position: fixed;
    inset: 0;
    z-index: -2;
    background:
        linear-gradient(135deg,
            rgba(8, 3, 18, 0.55) 0%,
            rgba(8, 3, 18, 0.35) 40%,
            rgba(8, 3, 18, 0.15) 70%,
            rgba(8, 3, 18, 0.35) 100%
        );
    pointer-events: none;
}

/* ===== Profile card (fixed top-center, 横長) ===== */
.profile-card {
    position: fixed;
    top: 40px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    width: min(880px, 92vw);
    padding: 24px 32px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 28px;
}

/* nav */
.profile-card nav {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
}
.profile-card nav a {
    padding: 5px 12px;
    border-radius: 999px;
    color: rgba(255,255,255,0.55);
    text-decoration: none;
    font-size: 12px;
    font-weight: 700;
    transition: all 0.2s;
}
.profile-card nav a:hover, .profile-card nav a.active {
    color: #fff;
    background: rgba(255,255,255,0.12);
}

/* Avatar + name */
.card-avatar-row {
    display: flex;
    align-items: center;
    gap: 16px;
}
.card-avatar {
    display: block;
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: 2.5px solid rgba(255,255,255,0.4);
    object-fit: cover;
    box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    flex-shrink: 0;
}
.card-name { font-size: 20px; font-weight: 800; }
.card-sub { font-size: 12px; color: rgba(255,255,255,0.5); font-weight: 600; margin-top: 3px; }

/* Info section */
.card-mid { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card-mid p {
    font-size: 12.5px;
    color: rgba(255,255,255,0.8);
    line-height: 1.5;
}
.card-side { display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
.card-section h4 {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    margin-bottom: 8px;
}
.tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}
.tag {
    min-height: 0;
    line-height: normal;
    padding: 4px 11px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.85);
}

/* Links */
.card-links { display: flex; gap: 8px; }
.card-link {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: rgba(255,255,255,0.09);
    border: 1px solid rgba(255,255,255,0.18);
    transition: background 0.2s;
}
.card-link:hover { background: rgba(255,255,255,0.18); }
.card-link img { width: 15px; height: 15px; object-fit: contain; }

/* VRChat stats */
.stat-grid {
    display: flex;
    gap: 8px;
}
.stat-item {
    gap: 0;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 8px 12px;
    text-align: right;
}
.stat-label {
    font-size: 10px;
    color: rgba(255,255,255,0.4);
    font-weight: 700;
    margin-bottom: 3px;
}
.stat-value {
    font-size: 12px;
    color: rgba(255,255,255,0.9);
    font-weight: 700;
    white-space: nowrap;
}

/* ===== Scroll content (右下エリア) ===== */
/* z-index: auto — この要素自体は stacking context を作らない。
   Diamond を canvas の下 (-1)、filterBar を canvas の上 (20) に置くため。 */
.scroll-area {
    position: relative;
    min-height: 100vh;
    padding: 0 48px 80px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
}

/* 最初の画面: カードの下にヒントを配置 */
.hero-hint {
    height: 100vh;
}
.hero-hint-fixed {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
}
.hero-hint-label {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    margin-bottom: 12px;
}
.slide-dots {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
}
.slide-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    cursor: pointer;
    transition: background 0.3s, transform 0.3s;
}
.slide-dot.active { background: #fff; transform: scale(1.4); }

/* ===== Photo grid (スクロール先) ===== */
.photos-area {
    padding-top: 60px;
}

.photos-label {
    position: relative;
    z-index: 1;   /* above the liquid canvas (z:0) */
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    margin-bottom: 20px;
}

/* ===== Diamond mosaic =====
   z-index: -1 → liquid canvas (z:0) の下。ガラス越しに屈折される側。 */
.diamond-area {
    position: relative;
    z-index: -1;
}
.diamond-item {
    position: absolute;
    z-index: -1;
    pointer-events: none;
}
.diamond-inner {
    position: absolute;
    inset: var(--diamond-gap, 5px);
    z-index: 1;
    display: block;
    margin: 0;
    padding: 0;
    border: 0;
    clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    overflow: hidden;
    cursor: pointer;
    pointer-events: auto;
    background: transparent;
    font: inherit;
}
.diamond-inner:focus-visible {
    outline: 2px solid rgba(255,255,255,0.9);
    outline-offset: -2px;
}
.diamond-inner::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(135deg, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0.06) 30%, rgba(255,255,255,0) 55%, rgba(0,0,0,0.18) 100%);
    mix-blend-mode: overlay;
}
.diamond-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.5s, transform 0.4s;
}
.diamond-item img.loaded { opacity: 1; }

/* Hover演出は実際にhoverできる端末のみ */
@media (hover: hover) and (pointer: fine) {
    .diamond-item:hover img,
    .diamond-inner:hover img { transform: scale(1.08); }
}

/* ===== Filter bar =====
   sticky + z-index 20: liquid canvas (0) より上。ガラスのピクセルは
   このバーの「背景」としてだけ見え、文字/ボタンは常に前面。 */
.filter-bar {
    position: sticky;
    top: 24px;
    z-index: 20;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    width: fit-content;
    max-width: 100%;
    margin: 0 0 20px;
    padding: 16px 18px;
}
.filter-btn {
    min-height: 0;
    line-height: normal;
    box-shadow: none;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.65);
    cursor: pointer;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
}
.filter-btn:hover { background: rgba(255,255,255,0.12); color: #fff; transform: none; box-shadow: none; }
.filter-btn.active {
    background: var(--mina-gradient-primary);
    border-color: transparent;
    color: #fff;
}
.filter-sep { width: 1px; background: rgba(255,255,255,0.15); margin: 4px 4px; }

/* lightbox */
.lightbox {
    position: fixed;
    inset: 0;
    z-index: var(--mina-z-modal);
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(5,2,15,0.9);
    backdrop-filter: blur(16px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, visibility 0s linear 0.25s;
}
/* Performance mode: full-screen blurは最も高価なレイヤーなので無効化 */
[data-mina-performance="performance"] .lightbox {
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
}
.filter-btn:active { transform: none; box-shadow: none; }
.lightbox.open,
.lightbox.is-open { visibility: visible; opacity: 1; pointer-events: all; }
.lightbox.open,
.lightbox.is-open {
    animation: lightbox-fade-in 0.25s ease both;
    transition-delay: 0s;
}
.lightbox.is-closing {
    visibility: visible;
    opacity: 0;
    pointer-events: none;
    animation: lightbox-fade-out 0.25s ease both;
    transition-delay: 0s;
}
@keyframes lightbox-fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
}
@keyframes lightbox-fade-out {
    from { opacity: 1; }
    to { opacity: 0; }
}
.lightbox img {
    max-width: 90vw;
    max-height: 88vh;
    border-radius: 12px;
    box-shadow: 0 32px 80px rgba(0,0,0,0.6);
}
.lightbox-close {
    position: absolute;
    top: 20px; right: 24px;
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    min-height: 0;
    padding: 0;
    line-height: normal;
    box-shadow: none;
    transform: none;
    transition: background 0.2s;
}
.lightbox .lightbox-close {
    width: 40px;
    min-width: 40px;
    height: 40px;
    min-height: 40px;
    flex: 0 0 40px;
    aspect-ratio: 1 / 1;
    padding: 0;
    border-radius: 50%;
}
.lightbox-close:hover { background: rgba(255,255,255,0.22); transform: none; }

/* ===== Reduced motion ===== */
@media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .diamond-item img { transition: none; }
    .diamond-item:hover img,
    .diamond-inner:hover img { transform: none; }
    .lightbox,
    .lightbox.open,
    .lightbox.is-open,
    .lightbox.is-closing { animation: none; transition: none; }
}

/* ===== Mobile ===== */
@media (max-width: 640px) {
    .profile-card {
        top: 16px;
        padding: 16px 18px;
        grid-template-columns: 1fr;
        gap: 14px;
    }
    .profile-card nav { display: none; }
    .card-avatar { width: 56px; height: 56px; }
    .card-name { font-size: 16px; }
    .card-side { align-items: flex-start; }
    .stat-grid { flex-wrap: wrap; }
    .scroll-area { padding: 0 16px 48px; }
    .photos-area { padding-top: 40px; }
    .filter-bar { top: 12px; padding: 10px 12px; }
    .lightbox img { max-width: 96vw; max-height: 82vh; }
}
</style>

<script src="minaui.glass.js"></script>
<script>
let ALL_PHOTOS = [];

/* ===== Shared diamond layout ====================================
 * Pure function: area width + photo count -> tile placements.
 * THE ONLY layout source: both the DOM collage and the canvas scene
 * renderer consume the same plan, so they can never drift apart. */
/* @gallery-layout:start */
function planDiamondLayout(areaWidth, photoCount) {
    const TARGET_TILE = 200;
    const width = Math.max(1, areaWidth);
    const cols = Math.max(2, Math.round(width / TARGET_TILE));
    const S = width / cols;
    const HALF = S / 2;

    const BIG_OFFSETS = [[0, 0], [1, -1], [1, 1], [2, 0]];
    const HUGE_OFFSETS = [[0, 0], [1, -1], [1, 1], [2, -2], [2, 0], [2, 2], [3, -1], [3, 1], [4, 0]];
    const BIG_RATIO = 0.24;
    const HUGE_RATIO = 0.035;

    const seededRandom = seed => {
        const x = Math.sin(seed) * 10000;
        return x - Math.floor(x);
    };

    const occupied = new Set();
    const key = (s, d) => s + ',' + d;
    const isFree = (s, d) => !occupied.has(key(s, d));
    const canFit = (s, d, offsets) => offsets.every(([ds, dd]) => isFree(s + ds, d + dd));
    const mark = (s, d, offsets) => offsets.forEach(([ds, dd]) => occupied.add(key(s + ds, d + dd)));

    const dLimit = 2 * cols - 1;
    const placements = [];
    let maxBottom = 0;
    let s = 0;
    const maxRows = (photoCount || 0) * 4 + 40;

    while (placements.length < photoCount && s < maxRows) {
        for (let d = (s % 2 === 0 ? 2 : 1); d <= dLimit && placements.length < photoCount; d += 2) {
            if (!isFree(s, d)) continue;

            let k = 1;
            let offsets = [[0, 0]];
            const rnd = seededRandom(s * 1000 + d);
            if (rnd < HUGE_RATIO && canFit(s, d, HUGE_OFFSETS)) { k = 3; offsets = HUGE_OFFSETS; }
            else if (rnd < HUGE_RATIO + BIG_RATIO && canFit(s, d, BIG_OFFSETS)) { k = 2; offsets = BIG_OFFSETS; }

            let left = HALF * (d - k);
            let size = k * S;
            if (left < 0 || left + size > width) {
                k = 1;
                offsets = [[0, 0]];
                left = HALF * (d - 1);
                size = S;
            }

            mark(s, d, offsets);
            const top = HALF * s;
            placements.push({ left, top, size });
            maxBottom = Math.max(maxBottom, top + size);
        }
        s++;
    }

    return { cols, tile: S, half: HALF, gap: 5, placements, height: maxBottom };
}
/* @gallery-layout:end */

/* ===== Canvas scene renderer (shared layout) =====================
 * Redraws the SAME diamond collage into the sceneProvider canvas so the
 * Liquid Glass refracts the actual images behind the filterBar.
 * - same layout plan (positions/sizes/gap) as the DOM
 * - same object-fit: cover, same diamond clip, same gloss
 * - the DOM gap (--diamond-gap) shrinks the visible diamond INSIDE each
 *   tile: the scene must apply the same gap or images read 5px larger
 *   through the glass than in the DOM
 * - layout is anchored in DOCUMENT space (docLeft/docTop measured from the
 *   real collageArea rect); the scene draws in viewport space via
 *   docLeft - scrollX / docTop - scrollY. Hardcoding the .scroll-area
 *   padding (48px/16px) is FORBIDDEN — the real DOM rect is the source.
 * - images are cached and decoded once (duplicate requests join the SAME
 *   in-flight Promise); a finished load/decode coalesces ONE scene
 *   invalidation per frame so tiles appear in the glass without any user
 *   interaction.
 * - the scene base reproduces what the page REALLY shows behind the glass:
 *   body #0d0814 + the .bg-overlay gradient. The old fixed hero photo was
 *   removed (the DOM hides it), so the glass can never reveal a background
 *   that does not exist on the page. */
/* @diamond-scene:start */
const DiamondScene = (() => {
    const imgCache = new Map();          // src -> HTMLImageElement (decoded)
    const imgPending = new Map();         // src -> Promise (in-flight loads)

    let sceneCanvas = null;              // offscreen scene at document scale
    let sceneLayout = null;              // { placements, height, docLeft, docTop, gap }
    let scenePhotos = [];

    let sceneInvalidatePending = false;
    /** Coalesced scene invalidation: 100 resolved images in one frame must
     * schedule exactly ONE redraw, not 100 (and zero while loading). */
    const scheduleSceneInvalidate = () => {
        if (sceneInvalidatePending) return;
        sceneInvalidatePending = true;
        requestAnimationFrame(() => {
            sceneInvalidatePending = false;
            if (window._minaLiquid && !window._minaLiquid.destroyed) {
                window._minaLiquid.invalidateScene();
            }
        });
    };

    /** Resolve the decoded image for src. Concurrent requests for the same
     * src JOIN the same Promise (a Set here used to strand callers). */
    const getPhotoImage = (src) => {
        const hit = imgCache.get(src);
        if (hit) return Promise.resolve(hit);
        const pending = imgPending.get(src);
        if (pending) return pending;

        const promise = new Promise((resolve) => {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            const settle = () => {
                imgCache.set(src, img);
                imgPending.delete(src);
                resolve(img);
                // decoded pixels entered the cache -> the glass scene must
                // redraw even with zero user interaction (no scroll/resize).
                scheduleSceneInvalidate();
            };
            img.onload = () => {
                if (typeof img.decode === 'function') {
                    img.decode().then(settle).catch(() => { imgPending.delete(src); resolve(null); });
                } else settle();
            };
            img.onerror = () => { imgPending.delete(src); resolve(null); };
            img.src = src;
        });
        imgPending.set(src, promise);
        return promise;
    };

    const diamondPath = (ctx, x, y, size) => {
        ctx.beginPath();
        ctx.moveTo(x + size / 2, y);
        ctx.lineTo(x + size, y + size / 2);
        ctx.lineTo(x + size / 2, y + size);
        ctx.lineTo(x, y + size / 2);
        ctx.closePath();
    };

    const coverDraw = (ctx, img, x, y, w, h) => {
        const iw = img.naturalWidth || 1, ih = img.naturalHeight || 1;
        const s = Math.max(w / iw, h / ih);
        const dw = iw * s, dh = ih * s;
        ctx.drawImage(img, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
    };

    /** Draw the diamonds into a scene canvas in VIEWPORT coordinates.
     * The provider canvas is viewport-sized; the collage lives in
     * document space, so translate by the live scroll offsets. */
    const drawScene = (ctx, state) => {
        const w = state.cssWidth, h = state.cssHeight;
        const scale = state.drawScale || 1;
        const scrollX = state.scrollX || 0;
        const scrollY = state.scrollY || 0;
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, w * scale, h * scale);

        /* Base = exactly what the DOM shows behind the glass:
         * body background + the fixed .bg-overlay gradient. No hidden
         * hero photo (the DOM .bg-slideshow is display:none). */
        ctx.fillStyle = '#0d0814';
        ctx.fillRect(0, 0, w * scale, h * scale);
        /* Match the DOM .bg-overlay linear-gradient(135deg, ...). CSS
         * angles are aspect-ratio independent, so use the gradient's
         * projected extent instead of the canvas diagonal. */
        const gradientAngle = 135 * Math.PI / 180;
        const gradientDirX = Math.sin(gradientAngle);
        const gradientDirY = -Math.cos(gradientAngle);
        const gradientW = w * scale;
        const gradientH = h * scale;
        const gradientExtent = (gradientW * Math.abs(gradientDirX)
            + gradientH * Math.abs(gradientDirY)) / 2;
        const gradientCenterX = gradientW / 2;
        const gradientCenterY = gradientH / 2;
        const overlay = ctx.createLinearGradient(
            gradientCenterX - gradientDirX * gradientExtent,
            gradientCenterY - gradientDirY * gradientExtent,
            gradientCenterX + gradientDirX * gradientExtent,
            gradientCenterY + gradientDirY * gradientExtent
        );
        overlay.addColorStop(0, 'rgba(8, 3, 18, 0.55)');
        overlay.addColorStop(0.4, 'rgba(8, 3, 18, 0.35)');
        overlay.addColorStop(0.7, 'rgba(8, 3, 18, 0.15)');
        overlay.addColorStop(1, 'rgba(8, 3, 18, 0.35)');
        ctx.fillStyle = overlay;
        ctx.fillRect(0, 0, w * scale, h * scale);

        if (!sceneLayout) { ctx.restore(); return; }

        // document-space anchor -> viewport space (both axes)
        const viewLeft = (sceneLayout.docLeft || 0) - scrollX;
        const viewTop = (sceneLayout.docTop || 0) - scrollY;
        const gap = (sceneLayout.gap || 0) * scale;

        for (let i = 0; i < sceneLayout.placements.length; i++) {
            const pl = sceneLayout.placements[i];
            const photo = scenePhotos[i];
            if (!photo) continue;
            const x = (viewLeft + pl.left) * scale;
            const y = (viewTop + pl.top) * scale;
            const size = pl.size * scale;
            if (y > h * scale + 8 || y + size < -8) continue;   // viewport cull

            const img = imgCache.get(photo.thumb || photo.src);
            if (!img) { getPhotoImage(photo.thumb || photo.src); continue; }

            /* DOM: .diamond-inner { inset: var(--diamond-gap) } — the visible
             * diamond (clip + image + gloss) is the tile shrunk by gap on
             * every side. The scene must draw the SAME inner shape. */
            const innerX = x + gap;
            const innerY = y + gap;
            const innerSize = size - gap * 2;

            ctx.save();
            diamondPath(ctx, innerX, innerY, innerSize);
            ctx.clip();
            // object-fit: cover — same math as CSS, on the inner box
            coverDraw(ctx, img, innerX, innerY, innerSize, innerSize);
            // same top-left gloss as .diamond-inner::after
            const gloss = ctx.createLinearGradient(innerX, innerY, innerX + innerSize, innerY + innerSize);
            gloss.addColorStop(0, 'rgba(255,255,255,0.35)');
            gloss.addColorStop(0.3, 'rgba(255,255,255,0.06)');
            gloss.addColorStop(0.55, 'rgba(255,255,255,0)');
            gloss.addColorStop(1, 'rgba(0,0,0,0.18)');
            ctx.fillStyle = gloss;
            ctx.fillRect(innerX, innerY, innerSize, innerSize);
            ctx.restore();
        }
        ctx.restore();
    };

    /** Publish the layout in DOCUMENT space. docLeft/docTop come from the
     * real collageArea rect (never hardcoded paddings) so the scene and
     * the DOM can never drift horizontally or vertically. */
    const setLayout = (plan, photos, docLeft, docTop) => {
        sceneLayout = Object.assign({}, plan, { docLeft: docLeft || 0, docTop: docTop || 0 });
        scenePhotos = photos;
        // warm the image cache for everything near/after the fold
        photos.forEach(p => getPhotoImage(p.thumb || p.src));
    };

    return { drawScene, setLayout, imgCache, getPhotoImage };
})();
/* @diamond-scene:end */

/* ===== MinaLiquid (overlay) =====
 * sceneMode: 'overlay' — canvas paints ONLY the liquid regions; the DOM
 * keeps rendering the real page below. The filterBar's glass refracts
 * the Diamond collage via the sceneProvider above (renderer-owned scene
 * drawn from the SAME layout plan — not a DOM screenshot). */
window._minaLiquid = new MinaLiquid({
    sceneMode: 'overlay',
    backend: 'auto',
    maxElements: 2,
    glass: {
        lensWarp: 0.14,      // Natural: ~10-13% apparent magnification
        refraction: 0.34,
        blur: 2,
        fresnel: 0.16,
        specular: 0.12,
        dispersion: 0.02,
        edgeWidth: 0.2,
        saturation: 1.5
    },
    sceneProvider: {
        render(ctx, state) { DiamondScene.drawScene(ctx, state); }
    }
});
window._minaGlass = window._minaLiquid;   // legacy alias

/* ===== Lightbox ===== */
const collageArea = document.getElementById('collageArea');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
const lightboxClose = document.getElementById('lightboxClose');
let lightboxRequest = 0;
let lightboxCloseTimer = 0;
let lightboxTrigger = null;

function waitForImageDecode(img) {
    const decode = () => {
        if (typeof img.decode !== 'function') return Promise.resolve();
        return img.decode().catch(() => undefined);
    };
    if (img.complete) {
        return img.naturalWidth > 0
            ? decode()
            : Promise.reject(new Error('Lightbox image failed to load'));
    }
    return new Promise((resolve, reject) => {
        img.addEventListener('load', () => decode().then(resolve), { once: true });
        img.addEventListener('error', () => reject(new Error('Lightbox image failed to load')), { once: true });
    });
}

function preloadLightboxImage(src) {
    const preload = new Image();
    preload.decoding = 'async';
    preload.src = src;
    return waitForImageDecode(preload).then(() => preload);
}

function finishLightboxClose() {
    window.clearTimeout(lightboxCloseTimer);
    lightboxCloseTimer = 0;
    lightbox.classList.remove('is-closing', 'open', 'is-open');
    if (window.MinaUI) MinaUI.close(lightbox);
    lightboxImg.hidden = true;
    lightboxImg.removeAttribute('src');
    lightbox.removeAttribute('aria-busy');
    lightbox.setAttribute('aria-hidden', 'true');
    lightbox.hidden = true;
    const trigger = lightboxTrigger;
    lightboxTrigger = null;
    if (trigger && trigger.isConnected) {
        try { trigger.focus({ preventScroll: true }); }
        catch (_) { trigger.focus(); }
    }
}

function setLightboxOpen(open) {
    if (open) return;
    if (lightbox.hidden && !lightbox.classList.contains('is-open')) return;
    ++lightboxRequest;
    window.clearTimeout(lightboxCloseTimer);
    lightboxCloseTimer = 0;
    lightbox.classList.remove('open', 'is-open');
    lightbox.classList.add('is-closing');
    lightbox.setAttribute('aria-hidden', 'false');
    lightboxCloseTimer = window.setTimeout(finishLightboxClose, 320);
}

async function openLightbox(src, trigger) {
    const request = ++lightboxRequest;
    window.clearTimeout(lightboxCloseTimer);
    lightboxCloseTimer = 0;
    lightboxTrigger = trigger || document.activeElement;
    const wasOpen = !lightbox.hidden && (lightbox.classList.contains('open') || lightbox.classList.contains('is-open'));
    lightbox.classList.remove('is-closing', 'open', 'is-open');
    lightboxImg.hidden = true;
    lightbox.setAttribute('aria-busy', 'true');
    if (!wasOpen) lightbox.hidden = true;

    try {
        const preload = await preloadLightboxImage(src);
        if (request !== lightboxRequest) return;
        lightboxImg.src = preload.currentSrc || preload.src || src;
        await waitForImageDecode(lightboxImg);
        if (request !== lightboxRequest) return;
        lightbox.hidden = false;
        if (window.MinaUI) MinaUI.open(lightbox);
        lightbox.classList.add('open');
        lightbox.setAttribute('aria-hidden', 'false');
        lightbox.removeAttribute('aria-busy');
        lightboxImg.hidden = false;
    } catch (_) {
        if (request !== lightboxRequest) return;
        lightboxImg.hidden = true;
        lightbox.removeAttribute('aria-busy');
        lightbox.hidden = true;
        lightbox.setAttribute('aria-hidden', 'true');
    }
}

lightbox.addEventListener('animationend', e => {
    if (e.target === lightbox && e.animationName === 'lightbox-fade-out') finishLightboxClose();
});
lightboxClose.addEventListener('click', () => setLightboxOpen(false));
lightbox.addEventListener('click', e => {
    if (e.target === lightbox) {
        e.preventDefault();
        e.stopImmediatePropagation();
        setLightboxOpen(false);
    }
});
document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && (lightbox.classList.contains('open') || lightbox.classList.contains('is-open'))) {
        e.preventDefault();
        e.stopImmediatePropagation();
        setLightboxOpen(false);
    }
}, true);

/* ===== Lazy loading (DOM tiles) ===== */
const imgObserver = new IntersectionObserver((entries) => {
    for (const entry of entries) {
        if (!entry.isIntersecting) continue;
        loadImageTile(entry.target);
    }
}, { rootMargin: '400px' });

async function loadImageTile(img) {
    if (img.dataset.loadStarted || !img.dataset.src) return;
    img.dataset.loadStarted = '1';
    imgObserver.unobserve(img);
    img.src = img.dataset.src;
    try {
        if (typeof img.decode === 'function') await img.decode();
    } catch (_) {}
    img.classList.add('loaded');
}

/* ===== DOM collage ===== */
let currentPhotos = [];
let layoutWidth = 0;

function applyPlacement(item, pl) {
    item.style.left = pl.left + 'px';
    item.style.top = pl.top + 'px';
    item.style.width = pl.size + 'px';
    item.style.height = pl.size + 'px';
}

function createTile(p) {
    const item = document.createElement('div');
    item.className = 'diamond-item';
    const inner = document.createElement('div');
    inner.className = 'diamond-inner';
    inner.setAttribute('role', 'button');
    inner.tabIndex = 0;
    inner.setAttribute('aria-label', 'Open image');
    const img = document.createElement('img');
    img.decoding = 'async';
    img.alt = '';
    img.dataset.src = p.thumb || p.src;
    const openFromPoint = (e) => {
        const r = inner.getBoundingClientRect();
        const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        const hw = Math.max(r.width / 2, 1), hh = Math.max(r.height / 2, 1);
        const dx = Math.abs(e.clientX - cx), dy = Math.abs(e.clientY - cy);
        if (dx / hw + dy / hh > 1) return;
        openLightbox(p.src, inner);
    };
    inner.addEventListener('click', openFromPoint);
    inner.addEventListener('keydown', e => {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        e.preventDefault();
        openLightbox(p.src, inner);
    });
    inner.appendChild(img);
    item.appendChild(inner);
    return item;
}

/* renderCollage: builds the DOM collage AND publishes the same layout
 * to the scene provider. One layout source of truth. */
function renderCollage(photos) {
    currentPhotos = photos;
    const w = collageArea.clientWidth;
    layoutWidth = w;
    const plan = planDiamondLayout(w, photos.length);
    collageArea.style.setProperty('--diamond-gap', plan.gap + 'px');

    imgObserver.disconnect();
    collageArea.innerHTML = '';

    const frag = document.createDocumentFragment();
    photos.forEach((p, i) => {
        const item = createTile(p);
        applyPlacement(item, plan.placements[i]);
        frag.appendChild(item);
        imgObserver.observe(item.querySelector('img'));
    });
    collageArea.appendChild(frag);
    collageArea.style.height = plan.height + 'px';

    // publish to the scene renderer: same plan, same photos, document-space
    // anchor (docLeft AND docTop from the real rect — .scroll-area padding
    // is 48px desktop / 16px mobile but it is NEVER hardcoded here)
    const rect = collageArea.getBoundingClientRect();
    const docLeft = rect.left + window.scrollX;
    const docTop = rect.top + window.scrollY;
    DiamondScene.setLayout(plan, photos, docLeft, docTop);
    if (window._minaLiquid) window._minaLiquid.invalidateScene();
}

function relayoutCollage() {
    const items = collageArea.querySelectorAll('.diamond-item');
    if (items.length !== currentPhotos.length) {
        renderCollage(currentPhotos);
        return;
    }
    const plan = planDiamondLayout(collageArea.clientWidth, currentPhotos.length);
    plan.placements.forEach((pl, i) => applyPlacement(items[i], pl));
    collageArea.style.height = plan.height + 'px';
    const rect = collageArea.getBoundingClientRect();
    const docLeft = rect.left + window.scrollX;
    const docTop = rect.top + window.scrollY;
    DiamondScene.setLayout(plan, currentPhotos, docLeft, docTop);
    if (window._minaLiquid) window._minaLiquid.invalidateScene();
}

/* ===== Resize handling ===== */
let resizeRaf = 0;
function scheduleRelayout() {
    if (resizeRaf) return;
    resizeRaf = requestAnimationFrame(() => {
        resizeRaf = 0;
        const w = collageArea.clientWidth;
        if (!w || Math.abs(w - layoutWidth) < 1) return;
        layoutWidth = w;
        relayoutCollage();
    });
}

if (typeof ResizeObserver === 'function') {
    const collageRO = new ResizeObserver(entries => {
        for (const entry of entries) {
            const inlineSize = (entry.contentBoxSize && entry.contentBoxSize[0])
                ? entry.contentBoxSize[0].inlineSize
                : entry.contentRect.width;
            if (inlineSize && Math.abs(inlineSize - layoutWidth) >= 1) {
                scheduleRelayout();
                return;
            }
        }
    });
    collageRO.observe(collageArea);
} else {
    window.addEventListener('resize', scheduleRelayout, { passive: true });
}

/* ===== Scroll sync =====
 * The scene provider draws in viewport space (docTop - scrollY) on every
 * invalidated scene. While scrolling, the collage moves behind the sticky
 * filterBar continuously, so the scene must re-render per scroll tick —
 * invalidateScene() coalesces into the renderer's single RAF per frame. */
window.addEventListener('scroll', () => {
    if (!window._minaLiquid || window._minaLiquid.destroyed) return;
    window._minaLiquid.invalidateScene();
}, { passive: true });

/* ===== フィルターバー（全部 / 年 / 月） ===== */
const filterBar = document.getElementById('filterBar');

function buildFilterBar(photos) {
    const years = [...new Set(photos.map(p => p.y))].sort();
    filterBar.innerHTML = '';

    const allBtn = document.createElement('button');
    allBtn.className = 'filter-btn mina-btn mina-btn--pill active';
    allBtn.textContent = '全部';
    allBtn.onclick = () => selectFilter(allBtn, photos);
    filterBar.appendChild(allBtn);

    years.forEach(y => {
        const sep = document.createElement('div');
        sep.className = 'filter-sep';
        filterBar.appendChild(sep);

        const yBtn = document.createElement('button');
        yBtn.className = 'filter-btn mina-btn mina-btn--pill';
        yBtn.textContent = `${y}年`;
        yBtn.onclick = () => selectFilter(yBtn, photos.filter(p => p.y === y));
        filterBar.appendChild(yBtn);

        const months = [...new Set(photos.filter(p => p.y === y).map(p => p.m))].sort((a, b) => a - b);
        months.forEach(m => {
            const mBtn = document.createElement('button');
            mBtn.className = 'filter-btn mina-btn mina-btn--pill';
            mBtn.textContent = `${y}/${m}`;
            mBtn.onclick = () => selectFilter(mBtn, photos.filter(p => p.y === y && p.m === m));
            filterBar.appendChild(mBtn);
        });
    });
}

function selectFilter(btn, filtered) {
    filterBar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderCollage(filtered);
}

/* ===== Boot ===== */
fetch('memories/list.json').then(r => r.json()).then(data => {
    ALL_PHOTOS = data;
    buildFilterBar(ALL_PHOTOS);
    renderCollage(ALL_PHOTOS);
});
</script>
</body>
