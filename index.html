<!DOCTYPE html>
<html lang="ja" data-theme="dark" data-style="glass" data-accent="pink">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About | お刺身くん</title>

<link rel="stylesheet" href="minaui.css">
<link rel="icon" type="image/png" href="img/avaters/0.8.1/aikon_t.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
/* ===== Theme ===== */
:root {
    --mina-primary: #ec4899;
    --mina-primary-hover: #f472b6;
    --mina-primary-active: #be185d;
    --mina-gradient-primary: linear-gradient(135deg, #f472b6 0%, #ec4899 100%);
    --mina-glass-bg: rgba(160, 60, 100, 0.22);
    --mina-glass-bg-light: rgba(160, 60, 100, 0.30);
    --mina-glass-border: rgba(255, 255, 255, 0.25);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    background: #0d0814;
    color: #fff;
    overflow-x: hidden;
}

/* ===== WebGL canvas ===== */
#mina-glcanvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
    pointer-events: none;
}

/* MinaGlass(WebGL) paints the liquid lens behind these surfaces. Keep the
   surface transparent so the photo composition remains unchanged. */
.mina-glass--liquid,
.mina-glass-liquid {
    position: relative;
    overflow: hidden;
    /* The WebGL canvas is the surface. These resets keep MinaUI's generic
       glass component from adding a second native surface over the lens. */
    background: transparent;
    border: 0;
    border-radius: 0;
    box-shadow: none;
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
    color: #fff;
    text-shadow:
        0 1px 3px rgba(0, 0, 0, 0.45),
        0 1px 12px rgba(0, 0, 0, 0.25);
}

/*
  CONCEPT B: 写真が背景（fixed）として敷かれ、その上に
  プロフィールカードが fixed で浮かぶ。
  スクロールすると背景写真がスライドショーで切り替わり、
  プロフィールは常に前面に浮いたまま。
  画面下半分に写真サムネ一覧がオーバーレイで並ぶ。
*/

/* ===== Photo slideshow background ===== */
/* MinaGlass(WebGL)が動的に背景を描画するため、生画像レイヤーは表示しない（テクスチャ供給専用） */
.bg-slideshow {
    display: none;
}
.bg-slide {
    background-size: cover;
    background-position: center;
}

/* 背景グラデーションマスク: 上→中は暗く、右下は少し明るく */
.bg-overlay {
    position: fixed;
    inset: 0;
    z-index: 2;
    background:
        linear-gradient(135deg,
            rgba(8, 3, 18, 0.5) 0%,
            rgba(8, 3, 18, 0.3) 40%,
            rgba(8, 3, 18, 0.1) 70%,
            rgba(8, 3, 18, 0.3) 100%
        );
    pointer-events: none;
}

/* ===== Profile card (fixed top-center, 横長) ===== */
.profile-card {
    position: absolute;
    top: 40px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    width: min(880px, 92vw);
    padding: 24px 32px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 28px;
}

/* nav */
.profile-card nav {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
}
.profile-card nav a {
    padding: 5px 12px;
    border-radius: 999px;
    color: rgba(255,255,255,0.55);
    text-decoration: none;
    font-size: 12px;
    font-weight: 700;
    transition: all 0.2s;
}
.profile-card nav a:hover, .profile-card nav a.active {
    color: #fff;
    background: rgba(255,255,255,0.12);
}

/* Avatar + name */
.card-avatar-row {
    display: flex;
    align-items: center;
    gap: 16px;
}
.card-avatar {
    display: block;
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: 2.5px solid rgba(255,255,255,0.4);
    object-fit: cover;
    box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    flex-shrink: 0;
}
.card-name { font-size: 20px; font-weight: 800; }
.card-sub { font-size: 12px; color: rgba(255,255,255,0.5); font-weight: 600; margin-top: 3px; }

/* Info section */
.card-mid { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card-mid p {
    font-size: 12.5px;
    color: rgba(255,255,255,0.8);
    line-height: 1.5;
}
.card-side { display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
.card-section h4 {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    margin-bottom: 8px;
}
.tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}
.tag {
    min-height: 0;
    line-height: normal;
    padding: 4px 11px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.85);
}

/* Links */
.card-links { display: flex; gap: 8px; }
.card-link {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: rgba(255,255,255,0.09);
    border: 1px solid rgba(255,255,255,0.18);
    transition: background 0.2s;
}
.card-link:hover { background: rgba(255,255,255,0.18); }
.card-link img { width: 15px; height: 15px; object-fit: contain; }

/* VRChat stats */
.stat-grid {
    display: flex;
    gap: 8px;
}
.stat-item {
    gap: 0;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 8px 12px;
    text-align: right;
}
.stat-label {
    font-size: 10px;
    color: rgba(255,255,255,0.4);
    font-weight: 700;
    margin-bottom: 3px;
}
.stat-value {
    font-size: 12px;
    color: rgba(255,255,255,0.9);
    font-weight: 700;
    white-space: nowrap;
}

/* ===== Scroll content (右下エリア) ===== */
.scroll-area {
    position: relative;
    z-index: 5;
    isolation: isolate;
    min-height: 100vh;
    padding: 0 48px 80px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
}

/* 最初の画面: カードの下に画像を配置 */
.hero-hint {
    height: 100vh;
}
.hero-hint-fixed {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
}
.hero-hint-label {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    margin-bottom: 12px;
}
.slide-dots {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
}
.slide-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    cursor: pointer;
    transition: background 0.3s, transform 0.3s;
}
.slide-dot.active { background: #fff; transform: scale(1.4); }

/* ===== Photo grid (スクロール先) ===== */
.photos-area {
    padding-top: 60px;
}

.photos-label {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    margin-bottom: 20px;
}

/* ===== Diamond mosaic（菱形タイル、回転格子で大枠/巨大枠も隙間なく整合） ===== */
.diamond-area {
    position: relative;
    z-index: 0;
}
.diamond-item {
    position: absolute;
    z-index: 1;
    pointer-events: none;
}
.diamond-inner {
    position: absolute;
    inset: var(--diamond-gap, 5px);
    z-index: 1;
    display: block;
    margin: 0;
    padding: 0;
    border: 0;
    clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    overflow: hidden;
    cursor: pointer;
    pointer-events: auto;
    background: transparent;
    font: inherit;
    transform: translateZ(0);
}
.diamond-inner:focus-visible {
    outline: 2px solid rgba(255,255,255,0.9);
    outline-offset: -2px;
}
.diamond-inner::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(135deg, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0.06) 30%, rgba(255,255,255,0) 55%, rgba(0,0,0,0.18) 100%);
    mix-blend-mode: overlay;
}
.diamond-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.5s, transform 0.4s;
}
.diamond-item:hover img,
.diamond-inner:hover img { will-change: transform; }
.diamond-item img.loaded { opacity: 1; }
.diamond-item:hover img,
.diamond-inner:hover img { transform: scale(1.08); }

/* ===== Filter bar ===== */
.filter-bar {
    position: sticky;
    top: 24px;
    z-index: 50;
    isolation: isolate;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    width: fit-content;
    max-width: 100%;
    margin: 0 0 20px;
    padding: 16px 18px;
}
.filter-btn {
    min-height: 0;
    line-height: normal;
    box-shadow: none;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.65);
    cursor: pointer;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
}
.filter-btn:hover { background: rgba(255,255,255,0.12); color: #fff; transform: none; box-shadow: none; }
.filter-btn.active {
    background: var(--mina-gradient-primary);
    border-color: transparent;
    color: #fff;
}
.filter-sep { width: 1px; background: rgba(255,255,255,0.15); margin: 4px 4px; }

/* lightbox */
.lightbox {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(5,2,15,0.9);
    backdrop-filter: blur(16px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, visibility 0s linear 0.25s;
}
.filter-btn:active { transform: none; box-shadow: none; }
.lightbox.open,
.lightbox.is-open { visibility: visible; opacity: 1; pointer-events: all; }
.lightbox.open,
.lightbox.is-open {
    animation: lightbox-fade-in 0.25s ease both;
    transition-delay: 0s;
}
.lightbox.is-closing {
    visibility: visible;
    opacity: 0;
    pointer-events: none;
    animation: lightbox-fade-out 0.25s ease both;
    transition-delay: 0s;
}
@keyframes lightbox-fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
}
@keyframes lightbox-fade-out {
    from { opacity: 1; }
    to { opacity: 0; }
}
.lightbox img {
    max-width: 90vw;
    max-height: 88vh;
    border-radius: 12px;
    box-shadow: 0 32px 80px rgba(0,0,0,0.6);
}
.lightbox-close {
    position: absolute;
    top: 20px; right: 24px;
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    min-height: 0;
    padding: 0;
    line-height: normal;
    box-shadow: none;
    transform: none;
    transition: background 0.2s;
}
.lightbox .lightbox-close {
    width: 40px;
    min-width: 40px;
    height: 40px;
    min-height: 40px;
    flex: 0 0 40px;
    aspect-ratio: 1 / 1;
    padding: 0;
    border-radius: 50%;
}
.lightbox-close:hover { background: rgba(255,255,255,0.22); transform: none; }

/* ===== Mobile ===== */
@media (max-width: 640px) {
    .profile-card {
        top: 16px;
        padding: 16px 18px;
        grid-template-columns: 1fr;
        gap: 14px;
    }
    .profile-card nav { display: none; }
    .card-avatar { width: 56px; height: 56px; }
    .card-name { font-size: 16px; }
    .card-side { align-items: flex-start; }
    .stat-grid { flex-wrap: wrap; }
    .scroll-area { padding: 0 16px 48px; }
    .photos-area { padding-top: 40px; }
    .filter-bar { top: 12px; padding: 10px 12px; }
    .lightbox img { max-width: 96vw; max-height: 82vh; }
}
</style>
</head>
<body>

<!-- WebGL canvas (MinaGlass site extension) -->
<canvas id="mina-glcanvas"></canvas>

<!-- Photo slideshow background -->
<div class="bg-slideshow" id="bgSlideshow"></div>
<div class="bg-overlay"></div>

<!-- Fixed profile card (top-center, 横長) — mina-glass--liquid でWebGLレンズ効果 -->
<aside class="profile-card mina-glass mina-glass--liquid" id="profileCard">

    <div class="card-avatar-row">
        <img class="card-avatar mina-avatar mina-avatar--lg" src="img/avaters/0.8.1/aikon_at.png" alt="お刺身くん">
        <div>
            <div class="card-name">お刺身くん</div>
            <div class="card-sub">VRChat / Photography</div>
        </div>
    </div>

    <div class="card-mid">
        <div class="card-section">
            <p>Discordによくいます。VRChatでは写真を撮るのが好きです。</p>
        </div>
        <div class="tags mina-tag-list">
            <span class="tag mina-chip">写真撮影</span>
            <span class="tag mina-chip">ワールド巡り</span>
            <span class="tag mina-chip">友達との会話</span>
        </div>
    </div>

    <div class="card-side">
        <div class="stat-grid">
            <div class="stat-item mina-stat">
                <div class="stat-label">活動開始</div>
                <div class="stat-value">2023年11月</div>
            </div>
            <div class="stat-item mina-stat">
                <div class="stat-label">活動時間</div>
                <div class="stat-value">夜間・週末</div>
            </div>
        </div>
        <div class="card-links">
            <a href="https://ossmxun.net" class="card-link" target="_blank"><img src="img/logo/link.png" alt=""></a>
            <a href="https://x.com/os_vrc" class="card-link" target="_blank"><img src="img/logo/x.png" alt=""></a>
            <a href="https://bsky.app/profile/vrc.ossmxun.net" class="card-link" target="_blank"><img src="img/logo/bsky.png" alt=""></a>
        </div>
    </div>

</aside>


<!-- Scroll area (right side) -->
<div class="scroll-area">

    <!-- First screen: slide indicator -->
    <div class="hero-hint"></div>
    <div class="hero-hint-fixed">
        <div class="hero-hint-label">Memories</div>
        <div style="font-size:11px;color:rgba(255,255,255,0.2);letter-spacing:1px;">scroll ↓</div>
    </div>

    <!-- Photos -->
    <div class="photos-area">
        <div class="filter-bar mina-glass mina-glass--liquid" id="filterBar"></div>
        <div class="diamond-area" id="collageArea"></div>
    </div>

</div>

<!-- Lightbox -->
<div class="lightbox mina-modal" id="lightbox" role="dialog" aria-modal="true" aria-hidden="true" hidden data-mina-backdrop-close="true">
    <button type="button" class="lightbox-close mina-btn mina-btn--icon mina-btn--sm" id="lightboxClose" aria-label="Close image">✕</button>
    <img id="lightboxImg" src="" alt="" hidden>
</div>

<script src="minaui.js"></script>
<script src="minaui.glass.js"></script>
<script>
let ALL_PHOTOS = [];
const BG_IMAGE = 'memories/comp/2024-11/VRChat_2024-11-24_23-47-50.148_1920x1080.jpg';
fetch('memories/list.json').then(r => r.json()).then(data => {
    ALL_PHOTOS = data;
    buildFilterBar(ALL_PHOTOS);
    renderCollage(ALL_PHOTOS);
});

// 背景は固定画像を使用（thumbは480pxクロップのため画質劣化 → comp(フル解像度)を使用）
(() => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => window._minaGlass.uploadTexture(img);
    img.src = BG_IMAGE;
})();

// ===== MinaGlass init (背景固定, list.json取得後に背景差し替え) =====
window._minaGlass = MinaGlass.autoInit({
    // Keep the original page's two-surface composition while using MinaGlass's
    // expanded renderer for other sites.
    maxCards: 2,
    saturate: 1.5,
    whiteLevel: 0
});

// ===== Diamond tessellation (隙間なく敷き詰め) =====
const collageArea = document.getElementById('collageArea');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
const lightboxClose = document.getElementById('lightboxClose');
let lightboxRequest = 0;
let lightboxCloseTimer = 0;
let lightboxTrigger = null;

function waitForImageDecode(img) {
    const decode = () => {
        if (typeof img.decode !== 'function') return Promise.resolve();
        return img.decode().catch(() => undefined);
    };
    if (img.complete) {
        return img.naturalWidth > 0
            ? decode()
            : Promise.reject(new Error('Lightbox image failed to load'));
    }
    return new Promise((resolve, reject) => {
        img.addEventListener('load', () => decode().then(resolve), { once: true });
        img.addEventListener('error', () => reject(new Error('Lightbox image failed to load')), { once: true });
    });
}

function preloadLightboxImage(src) {
    const preload = new Image();
    preload.decoding = 'async';
    preload.src = src;
    return waitForImageDecode(preload).then(() => preload);
}

function finishLightboxClose() {
    window.clearTimeout(lightboxCloseTimer);
    lightboxCloseTimer = 0;
    lightbox.classList.remove('is-closing', 'open', 'is-open');
    if (window.MinaUI) MinaUI.close(lightbox);
    lightboxImg.hidden = true;
    lightboxImg.removeAttribute('src');
    lightbox.removeAttribute('aria-busy');
    lightbox.setAttribute('aria-hidden', 'true');
    lightbox.hidden = true;
    const trigger = lightboxTrigger;
    lightboxTrigger = null;
    if (trigger && trigger.isConnected) {
        try { trigger.focus({ preventScroll: true }); }
        catch (_) { trigger.focus(); }
    }
}

function setLightboxOpen(open) {
    if (open) return;
    if (lightbox.hidden && !lightbox.classList.contains('is-open')) return;
    ++lightboxRequest;
    window.clearTimeout(lightboxCloseTimer);
    lightboxCloseTimer = 0;
    lightbox.classList.remove('open', 'is-open');
    lightbox.classList.add('is-closing');
    lightbox.setAttribute('aria-hidden', 'false');
    lightboxCloseTimer = window.setTimeout(finishLightboxClose, 320);
}

async function openLightbox(src, trigger) {
    const request = ++lightboxRequest;
    window.clearTimeout(lightboxCloseTimer);
    lightboxCloseTimer = 0;
    lightboxTrigger = trigger || document.activeElement;
    const wasOpen = !lightbox.hidden && (lightbox.classList.contains('open') || lightbox.classList.contains('is-open'));
    lightbox.classList.remove('is-closing', 'open', 'is-open');
    lightboxImg.hidden = true;
    lightbox.setAttribute('aria-busy', 'true');
    if (!wasOpen) lightbox.hidden = true;

    try {
        const preload = await preloadLightboxImage(src);
        if (request !== lightboxRequest) return;
        lightboxImg.src = preload.currentSrc || preload.src || src;
        await waitForImageDecode(lightboxImg);
        if (request !== lightboxRequest) return;
        lightbox.hidden = false;
        if (window.MinaUI) MinaUI.open(lightbox);
        lightbox.classList.add('open');
        lightbox.setAttribute('aria-hidden', 'false');
        lightbox.removeAttribute('aria-busy');
        lightboxImg.hidden = false;
    } catch (_) {
        if (request !== lightboxRequest) return;
        lightboxImg.hidden = true;
        lightbox.removeAttribute('aria-busy');
        lightbox.hidden = true;
        lightbox.setAttribute('aria-hidden', 'true');
    }
}

lightbox.addEventListener('animationend', e => {
    if (e.target === lightbox && e.animationName === 'lightbox-fade-out') finishLightboxClose();
});
lightboxClose.addEventListener('click', () => setLightboxOpen(false));
lightbox.addEventListener('click', e => {
    if (e.target === lightbox) {
        e.preventDefault();
        e.stopImmediatePropagation();
        setLightboxOpen(false);
    }
});
document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && (lightbox.classList.contains('open') || lightbox.classList.contains('is-open'))) {
        e.preventDefault();
        e.stopImmediatePropagation();
        setLightboxOpen(false);
    }
}, true);

const imgObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        const img = entry.target;
        img.src = img.dataset.src;
        img.onload = () => img.classList.add('loaded');
        imgObserver.unobserve(img);
    });
}, { rootMargin: '400px' });

let S = window.innerWidth < 640 ? 150 : 225;
let HALF = S / 2;
const GAP = 5;       // 菱形間の余白
collageArea.style.setProperty('--diamond-gap', GAP + 'px');

const BIG_RATIO = 0.24;   // 中サイズを増やし、横長画面でも視線のリズムを保つ
const HUGE_RATIO = 0.035; // 大枠

// (s,d) 格子: top=HALF*s, left=HALF*(d-k)。sとdは常に同じ偶奇。
// 大きい菱形が実際に覆う小セルの相対オフセットは実測済み（正方形ブロックではなく菱形状）。
const BIG_OFFSETS = [[0, 0], [1, -1], [1, 1], [2, 0]];
const HUGE_OFFSETS = [[0, 0], [1, -1], [1, 1], [2, -2], [2, 0], [2, 2], [3, -1], [3, 1], [4, 0]];

function seededRandom(seed) {
    let x = Math.sin(seed) * 10000;
    return x - Math.floor(x);
}

function renderCollage(photos) {
    collageArea.innerHTML = '';
    if (photos.length === 0) return;

    const W = collageArea.clientWidth || window.innerWidth;
    const occupied = new Set();
    const key = (s, d) => s + ',' + d;
    const isFree = (s, d) => !occupied.has(key(s, d));
    const canFit = (s, d, offsets) => offsets.every(([ds, dd]) => isFree(s + ds, d + dd));
    const mark = (s, d, offsets) => offsets.forEach(([ds, dd]) => occupied.add(key(s + ds, d + dd)));

    let idx = 0;
    let maxBottom = 0;
    let s = 0;
    const maxS = photos.length * 4 + 40; // 安全上限

    while (idx < photos.length && s < maxS) {
        const parity = ((s % 2) + 2) % 2;
        const dMin = Math.floor(-(W / 2) / HALF) - 4;
        const dMax = Math.ceil((W * 1.5) / HALF) + 4;
        let dStart = dMin + ((((dMin % 2) + 2) % 2) === parity ? 0 : 1);

        for (let d = dStart; d <= dMax && idx < photos.length; d += 2) {
            if (!isFree(s, d)) continue;

            let k = 1, offsets = [[0, 0]];
            const rnd = seededRandom(s * 1000 + d);
            if (rnd < HUGE_RATIO && canFit(s, d, HUGE_OFFSETS)) { k = 3; offsets = HUGE_OFFSETS; }
            else if (rnd < HUGE_RATIO + BIG_RATIO && canFit(s, d, BIG_OFFSETS)) { k = 2; offsets = BIG_OFFSETS; }

            const top = HALF * s;
            let left = HALF * (d - k);
            let size = k * S;
            if (left < 0 || left + size > W) {
                k = 1; offsets = [[0, 0]];
                left = HALF * (d - k);
                size = k * S;
                if (left < 0 || left + size > W) continue;
            }

            mark(s, d, offsets);
            const p = photos[idx++];
            const item = document.createElement('div');
            item.className = 'diamond-item';
            item.style.left = left + 'px';
            item.style.top = top + 'px';
            item.style.width = size + 'px';
            item.style.height = size + 'px';

            const inner = document.createElement('div');
            inner.className = 'diamond-inner';
            inner.setAttribute('role', 'button');
            inner.tabIndex = 0;
            inner.setAttribute('aria-label', 'Open image');
            const img = document.createElement('img');
            img.dataset.src = p.thumb || p.src;
            img.loading = 'lazy';
            img.decoding = 'async';
            img.alt = '';
            const openFromPoint = (e) => {
                const r = inner.getBoundingClientRect();
                const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
                const hw = Math.max(r.width / 2, 1), hh = Math.max(r.height / 2, 1);
                const dx = Math.abs(e.clientX - cx), dy = Math.abs(e.clientY - cy);
                if (dx / hw + dy / hh > 1) return;
                openLightbox(p.src, inner);
            };
            inner.addEventListener('click', openFromPoint);
            inner.addEventListener('keydown', e => {
                if (e.key !== 'Enter' && e.key !== ' ') return;
                e.preventDefault();
                openLightbox(p.src, inner);
            });
            inner.appendChild(img);
            item.appendChild(inner);
            collageArea.appendChild(item);
            imgObserver.observe(img);
            maxBottom = Math.max(maxBottom, top + size);
        }
        s++;
    }
    collageArea.style.height = maxBottom + 'px';
}

// ===== フィルタバー（全部 / 年 / 月） =====
const filterBar = document.getElementById('filterBar');

function buildFilterBar(photos) {
    const years = [...new Set(photos.map(p => p.y))].sort();
    filterBar.innerHTML = '';

    const allBtn = document.createElement('button');
    allBtn.className = 'filter-btn mina-btn mina-btn--pill active';
    allBtn.textContent = '全部';
    allBtn.onclick = () => selectFilter(allBtn, photos);
    filterBar.appendChild(allBtn);

    years.forEach(y => {
        const sep = document.createElement('div');
        sep.className = 'filter-sep';
        filterBar.appendChild(sep);

        const yBtn = document.createElement('button');
        yBtn.className = 'filter-btn mina-btn mina-btn--pill';
        yBtn.textContent = `${y}年`;
        yBtn.onclick = () => selectFilter(yBtn, photos.filter(p => p.y === y));
        filterBar.appendChild(yBtn);

        const months = [...new Set(photos.filter(p => p.y === y).map(p => p.m))].sort((a, b) => a - b);
        months.forEach(m => {
            const mBtn = document.createElement('button');
            mBtn.className = 'filter-btn mina-btn mina-btn--pill';
            mBtn.textContent = `${y}/${m}`;
            mBtn.onclick = () => selectFilter(mBtn, photos.filter(p => p.y === y && p.m === m));
            filterBar.appendChild(mBtn);
        });
    });
}

function selectFilter(btn, filtered) {
    filterBar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderCollage(filtered);
}

window.addEventListener('resize', () => {
    S = window.innerWidth < 640 ? 150 : 225;
    HALF = S / 2;
    renderCollage(ALL_PHOTOS);
});

</script>
