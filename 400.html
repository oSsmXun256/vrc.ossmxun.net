<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>400 Bad Request</title>

    <link rel="stylesheet" href="minaui.css">
    <script src="minaui.js" defer></script>

    <link rel="icon" type="image/webp" href="https://ossmxun.net/img/aikon.w/n_ossm_nc.webp">

    <meta name="robots" content="noindex,nofollow">

    <meta property="og:title" content="400 Bad Request | お刺身くん">
    <meta property="og:description" content="リクエストに不正な形式、構文エラー、または解釈不能な内容が含まれています。">
    <meta property="og:image" content="https://ossmxun.net/img/original/new_header.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="400 Bad Request | お刺身くん">
    <meta name="twitter:description" content="リクエストに不正な形式、構文エラー、または解釈不能な内容が含まれています。">
    <meta name="twitter:image" content="https://ossmxun.net/img/original/new_header.png">

    <style>
        body {
            color: #fff;
            background:
                radial-gradient(circle at 1px 1px, rgba(255,255,255,0.18) 1px, transparent 0) 0 0/26px 26px,
                linear-gradient(135deg, #667eea, #9f85d6);
            background-attachment: fixed;
        }
        .error-box {
            max-width: 28rem;
            position: relative;
            overflow: hidden;
            --mina-glass-bg: rgba(255,255,255,0.1);
            --mina-glass-border: rgba(255,255,255,0.45);
            --mina-glass-blur: 22px;
            --mina-glass-saturate: 120%;
            --mina-shadow-md: 0 24px 60px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.35);
        }
        .error-box .mina-h2 { color: #fff; font-size: 24px; font-weight: 700; letter-spacing: normal; line-height: normal; }
        .error-box .mina-small { color: #fff; line-height: 1.75; }
        .error-box .mina-btn { min-height: auto; padding: 10px 16px; border-radius: 12px; color: #fff; font-weight: 600; line-height: normal; box-shadow: none; transform: none; }
        .error-box .mina-btn:hover { color: #fff; transform: none; box-shadow: none; }
        .error-box .mina-btn:active { transform: translateY(1px) scale(0.98); }
        .error-box .mina-btn--primary { border: 0; background: #4e70df; transition: all 0.2s ease; }
        .error-box .mina-btn--primary:hover { background: #6b8aff; }
        .error-box .mina-btn--glass { border: 1px solid rgba(255,255,255,0.45); background: rgba(255,255,255,0.07); transition: background 0.15s ease; }
        .error-box .mina-btn--glass:hover { background: rgba(255,255,255,0.16); }
        .error-code { font-size: 5rem; font-weight: 800; text-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    </style>
</head>
<body class="mina-flex mina-flex--center mina-min-h-screen mina-p-4">

    <div class="mina-glass mina-glass--sm mina-p-8 mina-text-center mina-w-full mina-flex mina-flex--center mina-flex--column mina-gap-6 error-box">

        <div class="error-code">400</div>

        <h1 class="mina-h2 mina-m-0">Bad Request</h1>

        <p class="mina-small">
            リクエストに不正な形式、構文エラー、または解釈不能な内容が含まれています。<br>入力内容や送信データをご確認ください。
        </p>

        <div class="mina-flex mina-flex--column mina-gap-4 mina-w-full">
            <a href="https://ossmxun.net/" class="mina-btn mina-btn--primary mina-justify-center">
                ホームに戻る
            </a>
            <button onclick="history.back()" class="mina-btn mina-btn--glass mina-w-full mina-justify-center">
                ← 前のページに戻る
            </button>
        </div>
    </div>
</body>
</html>
